[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop-assistant"
version = "0.0.0"
description = "Personal voice-controlled desktop assistant (skeleton only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "import-linter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.importlinter]
root_package = "jarvis"

[[tool.importlinter.contracts]]
name = "Core depends only on allowed layers"
type = "forbidden"
source_modules = ["jarvis.core"]
forbidden_modules = ["jarvis.adapters", "jarvis.tools", "jarvis.platform"]

[[tool.importlinter.contracts]]
name = "Safety is independent of tools"
type = "forbidden"
source_modules = ["jarvis.safety"]
forbidden_modules = ["jarvis.tools"]

[[tool.importlinter.contracts]]
name = "Only platform contains OS-specific implementation"
type = "forbidden"
source_modules = ["jarvis.core", "jarvis.interfaces", "jarvis.adapters", "jarvis.tools", "jarvis.safety", "jarvis.services", "jarvis.hud_server", "jarvis.settings"]
forbidden_modules = ["winreg", "ctypes", "subprocess", "platform"]
